name: Compilar APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: npm run build

      - name: Preparar proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rescate-solidario.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rescate-solidario-apk
          path: rescate-solidario.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rescate-solidario.apk
          tag_name: ${{ github.ref_name }}
